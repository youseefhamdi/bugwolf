# bugwolf-chain-h100-v1
## Source: H1 #792927 (IDOR read + update), multiple private programs
## License: bugwolf-MIT
# Port: 2026-09-05
# Severity: high
# Bounty band: $2,500 – $15,000
schema: bugwolf-chain-h100-v1
id: 08_idor_pii_leak
title: "IDOR → Mass PII Leak"
bounty: "$8K H100"
prerequisites:
  - id: idor_on_numeric_id
    description: "An endpoint accepts a numeric or UUID resource ID without per-resource authZ"
  - id: enumerable_id_space
    description: "ID space is enumerable (sequential integers, predictable UUIDv1)"
  - id: sensitive_payload
    description: "The resource payload includes PII (name, email, phone, address, tax_id)"
steps:
  - order: 1
    description: "Identify an endpoint that returns user-scoped data keyed by ID"
    protocol: http
    technique: endpoint_discovery
    evidence:
      kind: request
      method: GET
      url: "/api/v1/users/:id/profile"
    destructive: false
  - order: 2
    description: "Confirm IDOR by reading another user's resource using a low-priv account"
    protocol: http
    technique: idor_confirm
    evidence:
      kind: response
      status: 200
      description: "Returns data for an ID not owned by the requester"
    destructive: false
  - order: 3
    description: "Enumerate the ID space (sequential walk, or 1..N where N is page count)"
    protocol: http
    technique: id_enumeration
    evidence:
      kind: action
      description: "Use a token from a test account; record 200/404 per ID"
    destructive: false
  - order: 4
    description: "Collect PII payloads from all successful reads into a local evidence store"
    protocol: http
    technique: pii_harvest
    evidence:
      kind: list
      fields: [email, phone, address, ssn_last4]
    destructive: false
  - order: 5
    description: "Validate uniqueness of records (no duplicate hashes → no truncation)"
    protocol: db
    technique: dedupe
    evidence:
      kind: action
      description: "sha256 each payload; count distinct vs total"
    destructive: false
  - order: 6
    description: "Document blast radius (count of records, count of unique PII fields)"
    protocol: internal
    technique: blast_radius_report
    evidence:
      kind: metric
      fields: [records, pii_fields]
    destructive: false
final_severity: high
references:
  - "HackerOne #792927 — IDOR read + update on user profiles"
  - "HackerOne #996678 — Mass assignment role escalation"
  - "OWASP API Security Top 10 — BOLA"
