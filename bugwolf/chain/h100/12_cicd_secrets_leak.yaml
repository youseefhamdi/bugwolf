# bugwolf-chain-h100-v1
## Source: H1 #437878 (GitHub Actions secret exposure), multiple Travis/GH Actions reports
## License: bugwolf-MIT
# Port: 2026-09-05
# Severity: critical
# Bounty band: $5K – $30K
schema: bugwolf-chain-h100-v1
id: 12_cicd_secrets_leak
title: "CI/CD Workflow → Secret in Logs → Infrastructure Pivot"
bounty: "$15K H100"
prerequisites:
  - id: public_or_forkable_repo
    description: "CI workflow is defined in a public/forkable repository"
  - id: secrets_in_env
    description: "Workflow exposes repository or organization secrets to PR builds"
  - id: log_persistence
    description: "Build logs are public or retained for a long period"
steps:
  - order: 1
    description: "Identify a CI workflow that uses untrusted input from a pull request"
    protocol: ci
    technique: workflow_inspect
    evidence:
      kind: file
      path: ".github/workflows/ci.yml"
    destructive: false
  - order: 2
    description: "Confirm secrets are exposed to the untrusted PR build (env: block, ${{ secrets.X }})"
    protocol: ci
    technique: secret_exposure_check
    evidence:
      kind: workflow_field
      field: "pull_request_target"
    destructive: false
  - order: 3
    description: "Open a pull request from a fork that echoes the secret to the build log"
    protocol: ci
    technique: pr_secret_dump
    preconditions:
      - "scope_approval"
      - "fork_repo_available"
    evidence:
      kind: log
      description: "echo $SECRET in a step that runs in the PR context"
    destructive: false
  - order: 4
    description: "Read the secret from the public build log URL"
    protocol: ci
    technique: log_read
    evidence:
      kind: log
      fields: [token_value, secret_value]
    destructive: false
  - order: 5
    description: "Use the secret to authenticate against the cloud / package registry / API"
    protocol: cloud
    technique: secret_replay
    preconditions:
      - "scope_approval"
    evidence:
      kind: action
      description: "Replay the token against the matching service"
    destructive: false
  - order: 6
    description: "Enumerate accessible resources to document the blast radius"
    protocol: cloud
    technique: blast_radius
    preconditions:
      - "scope_approval"
    evidence:
      kind: action
      description: "Read-only enumeration of accessible projects / buckets / APIs"
    destructive: false
final_severity: critical
references:
  - "HackerOne #437878 — GitHub Actions secret exposure"
  - "GitGuardian: Public CI logs leaking secrets"
  - "GitHub Security Lab: Workflow security guidance"
