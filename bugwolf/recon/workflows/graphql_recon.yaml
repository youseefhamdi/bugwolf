schema: bugwolf-recon-workflow-v1
name: graphql_recon
description: |
  GraphQL introspection — find endpoints, dump schemas, surface auth
  holes.  Active probing; operator signoff required.
phases:
  - order: 1
    name: endpoint_discovery
    tools: [katana, wayback]
    budget:
      max_requests: 100
      max_seconds: 600
    scope_verb: active
  - order: 2
    name: schema_introspection
    tools: [graphql-introspector]
    budget:
      max_requests: 25
      max_seconds: 600
    scope_verb: active
  - order: 3
    name: query_mining
    tools: [paramspider]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: active
  - order: 4
    name: authorization_probe
    tools: [httpx]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: active