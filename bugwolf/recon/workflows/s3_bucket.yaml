schema: bugwolf-recon-workflow-v1
name: s3_bucket
description: |
  S3 bucket enumeration — guess bucket names, check public access
  permissions, list keys (anonymous).
phases:
  - order: 1
    name: bucket_name_generation
    tools: [cloud_enum, s3scanner]
    budget:
      max_requests: 200
      max_seconds: 1800
    scope_verb: passive
  - order: 2
    name: bucket_existence_check
    tools: [s3scanner]
    budget:
      max_requests: 200
      max_seconds: 1800
    scope_verb: passive
  - order: 3
    name: bucket_permission_probe
    tools: [s3scanner]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: passive
  - order: 4
    name: bucket_key_list
    tools: [s3scanner]
    budget:
      max_requests: 50
      max_seconds: 1200
    scope_verb: active