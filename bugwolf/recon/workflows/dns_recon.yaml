schema: bugwolf-recon-workflow-v1
name: dns_recon
description: |
  DNS recon — query passive DNS, brute force common names, walk zone
  transfers (if the operator has explicitly authorised them).
phases:
  - order: 1
    name: passive_dns_intel
    tools: [crt_sh, shodan, censys]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: passive
  - order: 2
    name: dns_brute_force
    tools: [dns_brute, subdomain_alts]
    budget:
      max_requests: 200
      max_seconds: 1800
    scope_verb: passive
  - order: 3
    name: subdomain_resolution
    tools: [dnsx, massdns]
    budget:
      max_requests: 200
      max_seconds: 1800
    scope_verb: passive
  - order: 4
    name: dns_history
    tools: [wayback]
    budget:
      max_requests: 100
      max_seconds: 600
    scope_verb: passive