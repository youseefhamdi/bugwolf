schema: bugwolf-recon-workflow-v1
name: credential_leak
description: |
  Credential leak search — scan GitHub, GitLab, public S3, and
  Pastebin-style archives for the target's leaked secrets.
phases:
  - order: 1
    name: github_secret_scan
    tools: [trufflehog, gitleaks, github_search]
    budget:
      max_requests: 200
      max_seconds: 1800
    scope_verb: passive
  - order: 2
    name: git_history_scan
    tools: [gitleaks]
    budget:
      max_requests: 100
      max_seconds: 1800
    scope_verb: passive
  - order: 3
    name: s3_leak_scan
    tools: [s3scanner]
    budget:
      max_requests: 200
      max_seconds: 1800
    scope_verb: passive
  - order: 4
    name: js_bundle_secret_scan
    tools: [trufflehog]
    budget:
      max_requests: 200
      max_seconds: 1800
    scope_verb: active