schema: bugwolf-recon-workflow-v1
name: tech_fingerprint
description: |
  Tech fingerprinting — passive Wappalyzer-style fingerprints via
  response headers, body hashes, and known asset paths.
phases:
  - order: 1
    name: header_harvest
    tools: [httpx, censys]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: active
  - order: 2
    name: body_signature_match
    tools: [httpx, nuclei]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: active
  - order: 3
    name: known_path_probe
    tools: [httpx, nikto]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: active
  - order: 4
    name: tls_fingerprint
    tools: [censys]
    budget:
      max_requests: 25
      max_seconds: 600
    scope_verb: passive