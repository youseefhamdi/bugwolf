schema: bugwolf-recon-workflow-v1
name: mobile_recon
description: |
  Mobile app recon — pull strings from APK / IPA, find associated
  API endpoints, scrape app store metadata.
phases:
  - order: 1
    name: app_store_metadata
    tools: [wayback]
    budget:
      max_requests: 50
      max_seconds: 600
    scope_verb: passive
  - order: 2
    name: domain_intel
    tools: [crt_sh, dns_brute, shodan]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: passive
  - order: 3
    name: api_endpoint_pivot
    tools: [katana, gau]
    budget:
      max_requests: 200
      max_seconds: 1800
    scope_verb: active
  - order: 4
    name: secret_scan
    tools: [trufflehog]
    budget:
      max_requests: 100
      max_seconds: 1200
    scope_verb: active