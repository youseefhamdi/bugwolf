schema: bugwolf-methodology-pattern-v1
id: broken_password_reset_v1
bug_class: auth_bypass
category: auth
severity: high
title: "Broken Password Reset Token Validation"
description: |
  The password reset endpoint accepts a token in the URL but does not verify ownership. The attacker can reset any user's password by submitting the target user's email with an attacker-controlled token.
detection:
  signature: "/api/password-reset\\?token="
  method: POST
  endpoint: "/api/password-reset"
remediation: |
  Bind reset tokens to a specific user and a single use, expire tokens within 15 minutes, invalidate all existing sessions on reset, and require the user to confirm via a verified channel.
references:
  - "https://owasp.org/auth/"
  - "https://portswigger.net/web-security/auth"
bounty_range: "$3K — $15K"
h100_proven: true
