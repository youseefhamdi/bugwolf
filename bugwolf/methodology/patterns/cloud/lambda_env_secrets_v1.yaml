schema: bugwolf-methodology-pattern-v1
id: lambda_env_secrets_v1
bug_class: cloud
category: cloud
severity: high
title: "Lambda Environment Variable Secret Exposure"
description: |
  A Lambda function stores database credentials, API keys, or signing secrets in plaintext environment variables. A misconfigured CloudWatch log subscription or an IAM escalation grants the attacker read access to the function configuration.
detection:
  signature: "process\\.env\\.[A-Z_]+|AWS_LAMBDA_FUNCTION_NAME"
  method: GET
  endpoint: "/"
remediation: |
  Store secrets in AWS Secrets Manager or Parameter Store, encrypt Lambda environment variables with a KMS key, and scope Lambda:GetFunctionConfiguration to a small admin role.
references:
  - "https://owasp.org/cloud/"
  - "https://portswigger.net/web-security/cloud"
bounty_range: "$3K — $15K"
h100_proven: false
