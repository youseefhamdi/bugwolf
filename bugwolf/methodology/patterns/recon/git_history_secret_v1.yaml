schema: bugwolf-methodology-pattern-v1
id: git_history_secret_v1
bug_class: recon
category: recon
severity: high
title: "Secret in Public Git History"
description: |
  A secret (API key, private key, OAuth client secret) was committed to a public repository and removed in a later commit. The attacker uses GitHub API search or tools like TruffleHog to recover the secret from history.
detection:
  signature: "AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
  method: GET
  endpoint: "/"
remediation: |
  Use pre-commit hooks that block secret commits, rotate any secret that ever appeared in version control, and use a secret scanner in CI.
references:
  - "https://owasp.org/recon/"
  - "https://portswigger.net/web-security/recon"
bounty_range: "$1K — $10K"
h100_proven: true
