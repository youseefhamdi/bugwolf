schema: bugwolf-methodology-pattern-v1
id: llm_prompt_injection_v1
bug_class: llm
category: llm_ai
severity: high
title: "Direct Prompt Injection in Chat Endpoint"
description: |
  The LLM-powered chat endpoint accepts user prompts verbatim and mixes them with system instructions. The attacker injects instructions that override the system prompt, exfiltrating the system prompt, jailbreaking the model, or coercing unintended actions via function calls.
detection:
  signature: "ignore previous|disregard the above|you are now"
  method: POST
  endpoint: "/api/chat"
remediation: |
  Separate user content from system instructions via structured prompts, validate function-call arguments server-side, and treat the LLM as an untrusted instruction channel.
references:
  - "https://owasp.org/llm_ai/"
  - "https://portswigger.net/web-security/llm_ai"
bounty_range: "$2K — $15K"
h100_proven: true
