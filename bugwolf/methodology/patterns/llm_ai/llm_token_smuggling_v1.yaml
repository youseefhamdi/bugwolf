schema: bugwolf-methodology-pattern-v1
id: llm_token_smuggling_v1
bug_class: llm
category: llm_ai
severity: high
title: "Token Smuggling via Unicode Normalization"
description: |
  The model's safety filter blocks obvious prompt-injection keywords but the attacker bypasses it via homoglyphs, zero-width characters, or alternate Unicode normalization forms that pass the filter but are interpreted by the LLM as the original characters.
detection:
  signature: "\\\\u200b|\\\\u200c|\\\\u200d|\\\\ufeff"
  method: POST
  endpoint: "/api/chat"
remediation: |
  Normalize Unicode to NFKC before safety-filter evaluation, expand homoglyphs in the filter, and use an allow-list of semantic intent rather than deny-listing keywords.
references:
  - "https://owasp.org/llm_ai/"
  - "https://portswigger.net/web-security/llm_ai"
bounty_range: "$2K — $10K"
h100_proven: false
