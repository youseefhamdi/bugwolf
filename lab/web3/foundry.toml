[profile.default]
src = "src"
out = "out"
libs = []
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

# Deterministic fuzz configuration for BugWolf invariant testing.
# Lowered to 64 runs so the fixture terminates in a local lab without Foundry
# network access; the in-process executor in tools/web3_fixture_runner.py
# performs deeper coverage when invoked.
[fuzz]
runs = 64
seed = "0x42424242"
max_test_rejects = 65536

[invariant]
runs = 16
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
